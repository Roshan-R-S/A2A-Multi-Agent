[project]
name = "a2a-multi-agent"
version = "0.1.0"
description = "A multi-agent system using Google's Agent2Agent (A2A) protocol"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "a2a-sdk[http-server]>=1.2.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
